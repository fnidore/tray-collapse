name: Check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装本地检查依赖
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin gjs gir1.2-adw-1 xvfb dbus-x11
      - name: 离线回归与设置窗口检查
        run: make check test-prefs
